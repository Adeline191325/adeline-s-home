<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="description" content="Reelmark connects growing brands with handpicked short-form video creators.">
  <title>Reelmark — Captivate Crowds with Snackable Reels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500&family=Inter+Tight:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{--forest:#08482d;--paper:#f5f8ef;--ink:#101410;--mint:#dae7c7;--s:1}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper)}
    body{font-family:Inter,Arial,sans-serif;color:var(--ink);display:grid;place-items:center}
    button,a{font:inherit}
    .frame{position:relative;width:1440px;height:1080px;overflow:hidden;background:var(--paper);transform:scale(var(--s));transform-origin:center}
    .topbar{position:absolute;inset:29px 39px auto 37px;height:42px;display:flex;align-items:center;z-index:20}
    .logo{display:flex;align-items:center;gap:9px;color:var(--forest);font-size:24px;font-weight:500;letter-spacing:-.04em;text-decoration:none}
    .logo svg{width:26px;height:29px;overflow:visible}
    .nav{position:absolute;left:468px;top:1px;height:40px;display:flex;align-items:center;gap:31px;white-space:nowrap}
    .nav a{color:#28302b;font-size:16.4px;text-decoration:none;transition:opacity .2s}
    .nav a:hover{opacity:.55}
    .actions{margin-left:auto;display:flex;gap:1px}
    .pill{height:40px;border-radius:999px;border:1px solid rgba(8,72,45,.12);display:grid;place-items:center;text-decoration:none;font-size:15.5px;font-weight:500}
    .login{width:92px;background:#fff;color:var(--forest)}
    .signup{width:97px;background:var(--forest);color:white;border-color:var(--forest)}
    .hero-copy{position:absolute;inset:0;z-index:12;pointer-events:none;text-align:center}
    .badge{position:absolute;left:575px;top:115px;width:292px;height:37px;border-radius:999px;background:var(--mint);color:var(--forest);display:grid;place-items:center;font-size:16.6px;font-weight:500;letter-spacing:-.015em}
    h1{position:absolute;left:0;right:0;top:168px;margin:0;font-family:"Inter Tight",Inter,sans-serif;font-size:88px;line-height:92px;letter-spacing:-.035em;font-weight:700}
    h1 span{display:block}
    h1 span+span{letter-spacing:-.022em}
    .subline{position:absolute;left:350px;top:392px;width:740px;margin:0;color:#5e5e61;font-size:20.8px;line-height:32px;letter-spacing:-.022em}
    .carousel{position:absolute;inset:472px 0 172px;z-index:5;cursor:grab;touch-action:none;user-select:none}
    .carousel.dragging{cursor:grabbing}
    .card{position:absolute;overflow:hidden;will-change:left,top,width,height,clip-path;isolation:isolate;background:#a8c59c}
    .media{position:absolute;inset:0;overflow:hidden}
    .media video,.media img{position:absolute;max-width:none;object-fit:fill;pointer-events:none}
    .media video{opacity:0;transition:opacity .45s ease}
    .media video.ready{opacity:1}
    .play{position:absolute;left:13px;bottom:13px;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:rgba(249,255,245,.66);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(7px);z-index:3}
    .play:after{content:"";margin-left:2px;border-left:7px solid var(--forest);border-top:5px solid transparent;border-bottom:5px solid transparent}
    .notes{position:absolute;inset:0;z-index:14;pointer-events:none;color:var(--forest);font-family:Caveat,cursive;font-weight:600}
    .slashes{position:absolute;left:263px;top:377px;width:51px;height:47px}
    .seen{position:absolute;left:1212px;top:310px;width:144px;font-size:32px;line-height:30px;text-align:left;transform:rotate(16deg)}
    .seen-arrow{position:absolute;left:1123px;top:391px;width:195px;height:221px;overflow:visible}
    .zero{position:absolute;left:521px;top:937px;font-size:28px;line-height:1;transform:rotate(24deg)}
    .zero-arrow{position:absolute;left:560px;top:914px;width:79px;height:48px;overflow:visible}
    .doodle path{fill:none;stroke:var(--forest);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .cta-wrap{position:absolute;left:617px;top:893px;width:190px;height:74px;border:2px dashed rgba(8,72,45,.75);border-radius:999px;display:grid;place-items:center;z-index:18;transform:rotate(-1deg)}
    .cta{width:172px;height:58px;border:0;border-radius:999px;background:var(--forest);color:white;font-size:17px;font-weight:500;cursor:pointer;transform:rotate(1deg);transition:transform .2s,background .2s}
    .cta:hover{transform:rotate(1deg) scale(1.035);background:#063a24}
    .cta:focus-visible,.pill:focus-visible,.nav a:focus-visible,.logo:focus-visible{outline:3px solid #8dbd77;outline-offset:3px}
    @media(max-width:820px){
      .frame{width:640px;height:900px}
      .topbar{inset:28px 28px auto 28px;height:48px}
      .logo{font-size:26px}.logo svg{width:28px;height:31px}
      .nav,.login{display:none}.actions{margin-left:auto}.signup{width:106px;height:46px;font-size:17px}
      .badge{left:164px;top:112px;width:312px;height:40px;font-size:17px}
      h1{top:178px;padding:0 26px;font-size:clamp(58px,9vw,72px);line-height:.98}
      h1 span{display:inline}h1 span+span:before{content:" "}
      .subline{left:60px;top:332px;width:520px;font-size:21px;line-height:31px}
      .subline br{display:none}
      .carousel{inset:458px 0 192px}
      .slashes{left:48px;top:378px}
      .seen,.seen-arrow{display:none}
      .cta-wrap{left:225px;top:789px}
      .zero{left:121px;top:823px;font-size:30px}.zero-arrow{left:157px;top:797px}
    }
    @media(prefers-reduced-motion:reduce){.media video{display:none}.cta{transition:none}}
  </style>
</head>
<body>
  <main class="frame" aria-label="Reelmark creator marketplace hero">
    <header class="topbar">
      <a class="logo" href="#" aria-label="Reelmark home">
        <svg viewBox="0 0 28 31" aria-hidden="true"><path d="M4 24C1 14 6 4 22 2c1 15-7 24-18 22Z" fill="#08482d"/><path d="M5 27C9 18 13 12 20 7" fill="none" stroke="#f5f8ef" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Reelmark</span>
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="#brands">Brands</a><a href="#creators">Creators</a><a href="#pricing">Pricing</a><a href="#uses">Use Cases</a><a href="#contact">Contact</a>
      </nav>
      <div class="actions"><a class="pill login" href="#login">Log in</a><a class="pill signup" href="#signup">Sign up</a></div>
    </header>

    <section class="hero-copy" aria-labelledby="headline">
      <div class="badge">Trusted by 120,000+ indie makers</div>
      <h1 id="headline"><span>Captivate Crowds</span><span>with Snackable Reels</span></h1>
      <p class="subline">Grow your brand with short, snappy product clips by<br>our handpicked video makers. Our crew is ready to<br>lift your next launch higher.</p>
    </section>

    <div class="carousel" aria-label="Featured creator videos. Drag to browse"></div>

    <div class="notes" aria-hidden="true">
      <svg class="slashes doodle" viewBox="0 0 51 47"><path d="M8 33 21 10"/><path d="M27 36 41 12"/></svg>
      <div class="seen">Be seen<br>with clips</div>
      <svg class="seen-arrow doodle" viewBox="0 0 195 221"><path d="M183 5C175 57 162 104 117 124 75 143 34 144 19 194"/><path d="m8 178 11 19 22-8"/></svg>
      <div class="zero">Zero cost</div>
      <svg class="zero-arrow doodle" viewBox="0 0 79 48"><path d="M6 41c17-4 37-14 54-31"/><path d="m48 9 15-2-2 15"/></svg>
    </div>

    <div class="cta-wrap"><button class="cta" type="button">Make a Reel</button></div>
  </main>

  <script>
  (()=>{
    const poster='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b7ebb74a-8c8a-4f7e-8f80-55e2d74ecd05.webp';
    const source='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/04fd3d5f-99d7-476e-98a4-46c08518ffb3.mp4';
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const frame=document.querySelector('.frame'),carousel=document.querySelector('.carousel');
    const cards=[]; let mobile=false,scale=1,offset=0,dragging=false,lastX=0,lastT=0,velocity=0,releaseT=0;
    const clock=document.documentElement.animate([{opacity:1},{opacity:1}],{duration:1e9,iterations:1});

    for(let i=0;i<10;i++){
      const card=document.createElement('div'); card.className='card'; card.setAttribute('aria-hidden','true');
      const media=document.createElement('div'); media.className='media';
      const img=document.createElement('img'); img.src=poster; img.alt='';
      media.append(img);
      let video=null;
      if(!reduced){
        video=document.createElement('video'); video.muted=true; video.loop=true; video.playsInline=true; video.preload='auto'; video.src=source;
        video.addEventListener('loadeddata',()=>{video.classList.add('ready');video.play().catch(()=>{});},{once:true});
        media.append(video);
      }
      const play=document.createElement('span');play.className='play';
      card.append(media,play);carousel.append(card);cards.push({card,img,video,index:i});
    }

    function resize(){
      mobile=innerWidth<=820;
      const fw=mobile?640:1440,fh=mobile?900:1080;
      scale=Math.min(innerWidth/fw,innerHeight/fh);
      document.documentElement.style.setProperty('--s',scale);
    }
    addEventListener('resize',resize,{passive:true});resize();

    const mod=(n,m)=>((n%m)+m)%m;
    function roundedPath(w,h,lt,rt,lb,rb){
      const r=Math.min(15,w/5),y0=Math.min(lt,rt),L=lt-y0,R=rt-y0,BL=lb-y0,BR=rb-y0,H=h;
      return `path("M ${r} ${L} Q 0 ${L} 0 ${L+r} L 0 ${BL-r} Q 0 ${BL} ${r} ${BL} L ${w-r} ${BR} Q ${w} ${BR} ${w} ${BR-r} L ${w} ${R+r} Q ${w} ${R} ${w-r} ${R} Z")`;
    }
    function draw(){
      const now=clock.currentTime||0;
      if(!dragging){
        const dt=Math.min(.05,(now-releaseT)/1000||0); releaseT=now;
        if(Math.abs(velocity)>.4){offset+=velocity*dt;velocity*=Math.pow(.05,dt)}
        else if(!reduced) offset-=50*dt;
      } else releaseT=now;

      const fw=mobile?640:1440,center=fw/2,pitch=mobile?150:196,total=pitch*10;
      cards.forEach((o,i)=>{
        let t=mod(i*pitch+offset+total/2,total)-total/2;
        const denom=mobile?310:706;
        let x=center+t*(1+.083*Math.pow(t/denom,2));
        const d=Math.min(1.35,Math.abs(x-center)/denom);
        const w=mobile?128+36*d*d:170+48*d*d;
        const left=x-w/2,right=x+w/2;
        const ql=Math.abs(left-center)/denom,qr=Math.abs(right-center)/denom;
        const base=mobile?202:280,grow=mobile?55:92;
        const lh=base+grow*Math.pow(ql,2.6),rh=base+grow*Math.pow(qr,2.6);
        const cy=(mobile?126:215)-12*d*d;
        const lt=cy-lh/2,rt=cy-rh/2,lb=cy+lh/2,rb=cy+rh/2;
        const top=Math.min(lt,rt),bottom=Math.max(lb,rb),h=bottom-top;
        o.card.style.left=(x-w/2)+'px';o.card.style.top=top+'px';o.card.style.width=w+'px';o.card.style.height=h+'px';
        o.card.style.clipPath=roundedPath(w,h,lt,rt,lb,rb);
        const tileH=Math.max(h,w/.7111),tileW=tileH*.7111,col=o.index%5,row=Math.floor(o.index/5);
        [o.img,o.video].filter(Boolean).forEach(el=>{el.style.width=tileW*5+'px';el.style.height=tileH*2+'px';el.style.left=-col*tileW+'px';el.style.top=-row*tileH+'px'});
      });
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    carousel.addEventListener('pointerdown',e=>{dragging=true;carousel.classList.add('dragging');carousel.setPointerCapture(e.pointerId);lastX=e.clientX;lastT=performance.now();velocity=0});
    carousel.addEventListener('pointermove',e=>{if(!dragging)return;const now=performance.now(),dx=(e.clientX-lastX)/scale,dt=Math.max(8,now-lastT)/1000;offset+=dx;velocity=.75*velocity+.25*(dx/dt);lastX=e.clientX;lastT=now});
    const release=e=>{if(!dragging)return;dragging=false;carousel.classList.remove('dragging');try{carousel.releasePointerCapture(e.pointerId)}catch(_){}};
    carousel.addEventListener('pointerup',release);carousel.addEventListener('pointercancel',release);

    if(!reduced){
      setInterval(()=>{const master=cards.find(c=>c.video&&c.video.readyState>=2)?.video;if(!master)return;cards.forEach(c=>{if(c.video&&c.video!==master&&c.video.readyState>=2&&Math.abs(c.video.currentTime-master.currentTime)>.08)c.video.currentTime=master.currentTime})},1000);
      const ease={duration:720,easing:'cubic-bezier(.22,.8,.25,1)',fill:'both'};
      document.querySelector('.topbar').animate([{opacity:0,transform:'translateY(-22px)'},{opacity:1,transform:'none'}],{...ease,delay:80});
      document.querySelector('.badge').animate([{opacity:0,transform:'scale(.72)'},{opacity:1,transform:'scale(1)'}],{...ease,delay:220});
      document.querySelectorAll('h1 span').forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(34px)',filter:'blur(12px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{...ease,duration:850,delay:350+i*120}));
      document.querySelector('.subline').animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{...ease,delay:640});
      carousel.animate([{opacity:0,transform:'translateY(55px)'},{opacity:1,transform:'none'}],{...ease,duration:1000,delay:700});
      document.querySelector('.cta-wrap').animate([{opacity:0,transform:'scale(.65) rotate(-1deg)'},{opacity:1,transform:'scale(1) rotate(-1deg)'}],{...ease,delay:920});
      document.querySelectorAll('.doodle path').forEach((p,i)=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:720,delay:970+i*80,easing:'ease-out',fill:'both'})});
      document.querySelectorAll('.seen,.zero').forEach((n,i)=>n.animate([{opacity:0},{opacity:1}],{duration:450,delay:1000+i*130,fill:'both'}));
    }
    document.querySelector('.cta').addEventListener('click',()=>document.querySelector('.signup').focus());
  })();
  </script>
</body>
</html>
